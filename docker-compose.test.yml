# Synthetic local integration stack. Requires apps/backend/.env with OPENAI_API_KEY
# for live interpretation tests. Never use patient documents in this stack.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: pregnantbot
      MYSQL_USER: pregnantbot
      MYSQL_PASSWORD: local-pregnantbot-password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-plocal-root-password']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - e2e-mysql:/var/lib/mysql

  telegram-stub:
    build:
      context: .
      dockerfile: docker/telegram-stub.Dockerfile
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: pregnantbot
      DB_PASSWORD: local-pregnantbot-password
      DB_NAME: pregnantbot
      API_KEY: local-test-api-key
      TELEGRAM_BOT_TOKEN: 123456789:test-token-for-local-e2e-only
      TELEGRAM_WIFE_USER_ID: '111111111'
      TELEGRAM_HUSBAND_USER_ID: '123169226'
      TELEGRAM_WEBHOOK_URL: ''
      TELEGRAM_WEBHOOK_SECRET: ''
      LOCAL_TEST_USER_ID: '123169226'
      LOCAL_TEST_USER_ROLE: husband
      TELEGRAM_API_BASE_URL: http://telegram-stub:8080
      TELEGRAM_STUB_URL: http://telegram-stub:8080
      OPENAI_MODEL: gpt-6.1-terra
    depends_on:
      mysql:
        condition: service_healthy
      telegram-stub:
        condition: service_healthy
    ports:
      - '127.0.0.1:3010:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  webapp:
    build:
      context: .
      dockerfile: docker/webapp.Dockerfile
    environment:
      API_KEY: local-test-api-key
      LOCAL_TEST_USER_ID: '123169226'
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:4200:80'

  playwright:
    build:
      context: .
      dockerfile: docker/playwright.Dockerfile
    profiles: ['e2e']
    environment:
      BACKEND_URL: http://backend:3000
      PLAYWRIGHT_EXTERNAL_BASE_URL: http://webapp
      API_KEY: local-test-api-key
      TELEGRAM_STUB_URL: http://telegram-stub:8080
      CI: 'true'
    command: ['sh', '-c', 'npm run test:e2e && node live-openai-e2e.mjs']
    depends_on:
      backend:
        condition: service_healthy

volumes:
  e2e-mysql:
